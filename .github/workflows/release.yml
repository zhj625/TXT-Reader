name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate stable release tag
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$' -or $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag must match the stable package.json version.'
          }
      - run: npm ci --registry=https://registry.npmjs.org
      - run: npm run verify:full
      - run: npm run make
      - run: pwsh -NoProfile -File tests/validate-windows-release.ps1
      - name: Upload complete update artifacts before publishing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $existing = gh release view $tag --repo $repo --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This version is already published. Bump the version instead.' }
          } else {
            gh release create $tag --repo $repo --verify-tag --draft --title "墨读 $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          $assets = @(Get-ChildItem out/make/squirrel.windows/x64 -File | Where-Object { $_.Name -eq 'RELEASES' -or $_.Name -eq 'TXT-Reader-Setup.exe' -or $_.Name -like '*-full.nupkg' } | ForEach-Object FullName)
          if ($assets.Count -ne 3) { throw 'Expected the installer, RELEASES and one full package.' }
          gh release upload $tag @assets --repo $repo --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Artifact upload failed; release remains a draft.' }
          gh release edit $tag --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the release.' }
